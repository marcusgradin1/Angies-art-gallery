<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Angie's Art Gallery — samtida konst med plats för känsla.">
  <title>Angie's Art Gallery</title>
  <style>
    :root{--paper:#f4f0e9;--wall:#fbfaf7;--ink:#292521;--muted:#756e66;--line:rgba(41,37,33,.22);--rose:#d8aaa5;--sage:#a7b5a8;--ochre:#c9a978;--rust:#b97d67;--blue:#8196a2;--max:1380px;--serif:Georgia,'Times New Roman',serif;--sans:Arial,Helvetica,sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans)}a{color:inherit;text-decoration:none}button,select,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;z-index:100;background:var(--wall);padding:10px}
    .siteHeader{position:sticky;top:0;z-index:20;padding:18px clamp(20px,4vw,64px);background:rgba(244,240,233,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.headerInner{max-width:var(--max);margin:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}.wordmark{font:600 clamp(1.1rem,1.5vw,1.35rem) var(--serif);letter-spacing:-.04em}.wordmark span{display:block;width:max-content;border-bottom:1px solid var(--ink);padding-bottom:4px}.mainNav{display:flex;align-items:center;gap:clamp(15px,2.2vw,36px);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}.mainNav a{padding:12px 0;border-bottom:1px solid transparent}.mainNav a:hover,.mainNav a.active{border-color:var(--ink)}.seal{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--paper);font:1.25rem var(--serif);letter-spacing:-.08em}.headerTools{justify-self:end;display:flex;align-items:center;gap:18px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}.headerTools button{min-height:44px}.cartCount{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.65rem;margin-left:4px}.menuButton{display:none}.searchPanel{display:none;position:absolute;right:clamp(20px,4vw,64px);top:86px;width:min(380px,calc(100vw - 40px));padding:20px;background:var(--wall);border:1px solid var(--line);box-shadow:0 18px 45px rgba(35,27,21,.14)}.searchPanel.open{display:block}.searchPanel input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 0;outline:0}.searchResults{display:grid;gap:6px;margin-top:12px}.searchResults a{padding:10px 0;border-top:1px solid var(--line);font-size:.82rem}.searchResults a:hover{color:var(--rust)}
    main{min-height:calc(100vh - 96px)}.page{max-width:var(--max);margin:auto;padding:clamp(64px,9vw,150px) clamp(20px,5vw,72px)}.eyebrow{color:var(--muted);font-size:.67rem;letter-spacing:.17em;text-transform:uppercase}.display{font:500 clamp(3.6rem,8vw,9rem)/.9 var(--serif);letter-spacing:-.08em;margin:20px 0 0}.lede{max-width:38ch;color:var(--muted);font-size:1rem;line-height:1.75}.button{display:inline-flex;align-items:center;gap:12px;margin-top:22px;padding:13px 18px;border:1px solid var(--ink);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase}.button:hover,.button:focus-visible{background:var(--ink);color:var(--paper)}:focus-visible{outline:2px solid var(--rust);outline-offset:4px}
    .homeHero{position:relative;max-width:var(--max);margin:auto;min-height:calc(100vh - 96px);padding:clamp(70px,10vh,150px) clamp(20px,5vw,72px);display:grid;grid-template-columns:minmax(220px,.7fr) minmax(320px,1.2fr) minmax(220px,.7fr);align-items:center;gap:clamp(28px,6vw,100px);overflow:hidden}.homeHero:after{content:'ANGIE\2019S ART GALLERY / 001';position:absolute;top:30px;left:clamp(20px,5vw,72px);font-size:.65rem;letter-spacing:.16em;color:var(--muted)}.heroCopy{align-self:end;padding-bottom:4vh}.heroCopy h1{font:500 clamp(3.6rem,6.2vw,7.6rem)/.88 var(--serif);letter-spacing:-.085em;margin:18px 0}.heroCopy p{max-width:29ch;color:var(--muted);line-height:1.75}.heroArtwork{position:relative;aspect-ratio:4/5;max-height:75vh;display:grid;place-items:center;background:var(--wall);border:1px solid var(--line);padding:13px}.heroArtwork:before{content:'';position:absolute;inset:-12px;border:1px solid var(--line);z-index:-1}.artImage{position:absolute;inset:13px;background:linear-gradient(145deg,var(--rust) 0 34%,#dfc39b 34% 68%,var(--sage) 68%)}.artImage:before{content:'';position:absolute;width:68%;height:27%;left:-7%;top:14%;border-radius:50%;background:rgba(255,251,239,.29);transform:rotate(-16deg)}.artImage:after{content:'';position:absolute;width:52%;height:28%;right:-10%;bottom:12%;border-radius:50%;background:rgba(35,44,43,.2);transform:rotate(15deg)}.artNumber{position:relative;z-index:1;color:rgba(251,250,247,.86);font:500 clamp(7rem,17vw,15rem)/1 var(--serif);letter-spacing:-.13em}.heroArtwork figcaption{position:absolute;right:0;bottom:-33px;color:var(--muted);font-size:.65rem;letter-spacing:.14em}.heroAside{align-self:end;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0}.heroAside h2{font:500 1.55rem var(--serif);margin:10px 0}.heroAside p{color:var(--muted);font-size:.82rem;line-height:1.65}.asideLink{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:.73rem;letter-spacing:.07em;text-transform:uppercase}.asideLink:hover{color:var(--rust)}
    .homeStatement{background:var(--ink);color:var(--paper);padding:clamp(70px,10vw,150px) max(clamp(20px,5vw,72px),calc((100% - var(--max))/2))}.homeStatement p{max-width:40ch;color:#d9d0c7}.homeStatement .display{max-width:700px}.artRail{max-width:var(--max);margin:auto;padding:clamp(70px,10vw,150px) clamp(20px,5vw,72px)}.railHead{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:44px}.railHead h2{font:500 clamp(2.8rem,6vw,7rem)/.9 var(--serif);letter-spacing:-.08em;margin:0}.railHead p{max-width:28ch;color:var(--muted)}.artGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line)}.artTile{aspect-ratio:3/4;display:grid;place-items:center;position:relative;background:var(--wall);font:500 clamp(2.5rem,5vw,5rem) var(--serif);transition:transform .35s}.artTile:nth-child(2n){aspect-ratio:1/1.15}.artTile:hover{transform:translateY(-8px);z-index:1}.artTile small{position:absolute;left:14px;bottom:12px;font:500 .65rem var(--sans);letter-spacing:.1em;color:var(--muted)}
    .contentGrid{display:grid;grid-template-columns:1fr 1.4fr;gap:clamp(40px,10vw,160px);align-items:start}.contentGrid .display{margin-top:12px}.list{max-width:760px;border-top:1px solid var(--line);margin-top:35px}.listRow{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}.listRow span:last-child{color:var(--muted)}.collectionBands{display:grid;gap:0;margin-top:60px}.collectionBand{display:grid;grid-template-columns:80px 1fr auto;gap:24px;align-items:center;padding:28px 0;border-top:1px solid var(--line)}.collectionBand h2{font:500 clamp(1.6rem,3vw,3rem) var(--serif);margin:0}.collectionBand p{color:var(--muted);max-width:40ch;margin:5px 0 0}.collectionNo{font:1.5rem var(--serif);color:var(--muted)}.galleryFeature{display:grid;grid-template-columns:1.3fr .7fr;gap:clamp(30px,8vw,120px);align-items:center}.galleryCanvas{aspect-ratio:4/5;background:linear-gradient(145deg,var(--rust),#dfc39b 55%,var(--blue));display:grid;place-items:center;font:clamp(8rem,18vw,16rem) var(--serif);color:rgba(251,250,247,.78)}.galleryFeature h2{font:500 clamp(3rem,6vw,7rem)/.9 var(--serif);letter-spacing:-.08em;margin:0}.printGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-top:60px}.printCard{background:var(--wall);padding:28px;min-height:230px}.printCard h2{font:500 2rem var(--serif);margin:25px 0 10px}.printCard p{color:var(--muted);font-size:.9rem}.productLayout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.65fr);gap:clamp(35px,8vw,130px);align-items:start}.productCanvas{aspect-ratio:4/5;background:var(--rust);display:grid;place-items:center;color:rgba(251,250,247,.82);font:clamp(9rem,20vw,18rem) var(--serif)}.productPanel{position:sticky;top:130px}.productPanel h1{font:500 clamp(3rem,6vw,7rem)/.9 var(--serif);letter-spacing:-.08em;margin:14px 0}.productPanel p{color:var(--muted);line-height:1.75}.field{margin:22px 0}.field label{display:block;margin-bottom:8px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}.field select{width:100%;padding:14px;border:1px solid var(--line);background:var(--wall)}.buyButton{width:100%;justify-content:center;background:var(--ink);color:var(--paper)}.buyButton:disabled{background:#ded9d2;color:#8a837b;cursor:not-allowed}.choiceHint{font-size:.76rem!important;margin-top:9px}.details{border-top:1px solid var(--line);margin-top:28px}.details summary{padding:16px 0;cursor:pointer;border-bottom:1px solid var(--line)}.details p{padding:0 0 13px;margin:0}.cartLayout{max-width:1100px}.cartHeader{display:flex;justify-content:space-between;align-items:end;gap:30px;border-bottom:1px solid var(--line);padding-bottom:28px}.cartHeader h1{font:500 clamp(3.5rem,7vw,8rem)/.9 var(--serif);letter-spacing:-.08em;margin:12px 0 0}.cartHeader p{max-width:30ch;color:var(--muted)}.cartGrid{display:grid;grid-template-columns:1.4fr .6fr;gap:80px;margin-top:55px}.cartRow{display:grid;grid-template-columns:80px 1fr auto;gap:18px;padding:20px 0;border-top:1px solid var(--line);align-items:center}.cartThumb{aspect-ratio:3/4;display:grid;place-items:center;font:1.8rem var(--serif)}.cartRow h2{font:500 1.2rem var(--sans);margin:0 0 5px}.cartMeta{color:var(--muted);font-size:.8rem}.remove{font-size:.72rem;text-decoration:underline}.summary{background:var(--wall);padding:26px;border-top:2px solid var(--ink)}.summary h2{font:500 2rem var(--serif);margin-top:0}.summaryLine{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}.empty{border-top:2px solid var(--ink);padding:30px 0;color:var(--muted)}
    footer{max-width:var(--max);margin:auto;padding:55px clamp(20px,5vw,72px);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:25px;color:var(--muted);font-size:.78rem}footer nav{display:flex;gap:22px}footer a:hover{color:var(--ink)}
    @media(max-width:1050px){.headerInner{grid-template-columns:1fr auto}.mainNav{display:none}.mainNav.open{display:flex;position:absolute;left:20px;right:20px;top:82px;padding:18px;justify-content:space-around;background:var(--wall);border:1px solid var(--line);box-shadow:0 18px 40px rgba(35,27,21,.12)}.menuButton{display:block;font-size:1.2rem}.homeHero{grid-template-columns:minmax(190px,.7fr) minmax(280px,1fr);gap:42px}.heroAside{grid-column:1/-1;max-width:600px}.artGrid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:700px){.siteHeader{padding:12px 20px}.headerTools{gap:8px}.headerTools button:first-child{display:none}.homeHero{display:flex;flex-direction:column;align-items:stretch;min-height:auto;padding:85px 20px 110px}.homeHero:after{left:20px}.heroArtwork{width:min(100%,520px);align-self:center}.heroCopy{order:2;padding:58px 0 0}.heroAside{order:3}.artRail,.page{padding-block:75px}.railHead,.cartHeader{display:block}.railHead p,.cartHeader p{margin-top:16px}.artGrid{grid-template-columns:repeat(2,1fr)}.contentGrid,.galleryFeature,.productLayout,.cartGrid{grid-template-columns:1fr;gap:45px}.productPanel{position:static}.printGrid{grid-template-columns:1fr}.collectionBand{grid-template-columns:45px 1fr}.collectionBand .button{grid-column:2;justify-self:start}.cartGrid{gap:35px}.cartRow{grid-template-columns:64px 1fr}.cartRow .remove{grid-column:2;justify-self:start}footer{flex-direction:column}}
    @media(max-width:380px){.artGrid{grid-template-columns:1fr}.display{font-size:3.4rem}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}.artTile:hover{transform:none}}
  </style>
</head>
<body>
  <a class="skip" href="#app">Hoppa till innehåll</a>
  <header class="siteHeader"><div class="headerInner"><a class="wordmark" href="#home" data-route="home"><span>Angie's Art</span></a><nav class="mainNav" id="mainNav" aria-label="Huvudnavigation"><a href="#gallery" data-route="gallery">Galleri</a><a href="#collections" data-route="collections">Kollektioner</a><a href="#prints" data-route="prints">Prints</a><a class="seal" href="#home" data-route="home" aria-label="Hem">AG</a><a href="#studio" data-route="studio">Ateljén</a><a href="#works" data-route="works">Konstverk</a><a href="#about" data-route="about">Om</a></nav><div class="headerTools"><button id="searchToggle" aria-expanded="false">Sök</button><button id="cartToggle">Varukorg <span class="cartCount" id="cartCount">0</span></button><button class="menuButton" id="menuToggle" aria-label="Öppna meny">☰</button></div><div class="searchPanel" id="searchPanel"><label class="eyebrow" for="searchInput">Sök i galleriet</label><input id="searchInput" placeholder="Sök efter verk, format eller kollektion"><div class="searchResults" id="searchResults"></div></div></div></header>
  <div id="app"></div>
  <footer><span>Angie's Art Gallery · samtida konst</span><nav><a href="#information" data-route="information">Information</a><a href="#prints" data-route="prints">Prints</a><a href="#about" data-route="about">Om</a></nav></footer>
  <script>
    const products=Array.from({length:10},(_,i)=>({id:i+1,title:`Verk ${String(i+1).padStart(2,'0')}`,color:['#b97d67','#71877f','#7888a2','#c9a978','#b77d86','#8c819d','#a76e5e','#5e8290','#a96a72','#6b876d'][i]}));
    const routes=['home','gallery','collections','prints','studio','works','about','information','cart',...products.map(p=>`product-${String(p.id).padStart(2,'0')}`)];const sizes=['30 × 30 cm','40 × 40 cm','50 × 50 cm','70 × 70 cm','100 × 100 cm','200 × 300 cm'];let cart=JSON.parse(localStorage.getItem('angies-cart')||'[]');
    const app=document.querySelector('#app'),nav=document.querySelector('#mainNav'),count=document.querySelector('#cartCount');const tile=p=>`<a class="artTile" style="background:${p.color}" href="#product-${String(p.id).padStart(2,'0')}" data-route="product-${String(p.id).padStart(2,'0')}" aria-label="Visa ${p.title}"><span>${String(p.id).padStart(2,'0')}</span><small>${p.title} · Visa verk</small></a>`;
    function saveCart(){localStorage.setItem('angies-cart',JSON.stringify(cart));count.textContent=cart.length}
    function shell(content){app.innerHTML=content;document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===currentRoute()));window.scrollTo({top:0,behavior:'smooth'})}
    function home(){return `<main><section class="homeHero"><div class="heroCopy"><span class="eyebrow">Samtida konst · Angie's Art</span><h1>Verk med plats för känsla.</h1><p>En stillsam, personlig samling av konst för rum där uttrycket får leva länge.</p><a class="button" href="#works" data-route="works">Upptäck verken ↗</a></div><a class="heroArtwork" href="#product-01" data-route="product-01" aria-label="Öppna Verk 01"><div class="artImage"></div><span class="artNumber">01</span><figcaption>01 · UTVALT VERK</figcaption></a><aside class="heroAside"><span class="eyebrow">I galleriet just nu</span><h2>En bild i taget.</h2><p>Bläddra genom verk, kollektioner och prints i din egen takt.</p><a class="asideLink" href="#gallery" data-route="gallery"><span>Besök galleriet</span><span>↗</span></a><a class="asideLink" href="#prints" data-route="prints"><span>Om prints</span><span>↗</span></a></aside></section><section class="homeStatement"><span class="eyebrow">Angie's Art Gallery</span><p class="display">Konsten först.<br>Alltid.</p><p>En digital gallerivägg med plats för verk som får följa med hem.</p></section><section class="artRail"><div class="railHead"><h2>Utvalda verk</h2><p>Placeholder-visning inför lansering. Varje verk får senare sin egen berättelse.</p></div><div class="artGrid">${products.slice(0,5).map(tile).join('')}</div></section></main>`}
    function simplePage(eyebrow,title,copy,extra=''){return `<main class="page"><div class="contentGrid"><div><span class="eyebrow">${eyebrow}</span><h1 class="display">${title}</h1></div><div><p class="lede">${copy}</p>${extra}</div></div></main>`}
    function gallery(){return `<main class="page"><span class="eyebrow">Galleri · utställning</span><div class="galleryFeature" style="margin-top:45px"><div class="galleryCanvas">01</div><div><h2>En bild i taget.</h2><p class="lede">Galleriet är en lugn utställningssal för nya verk, serier och visuella sammanhang.</p><a class="button" href="#product-01" data-route="product-01">Se Verk 01 ↗</a></div></div><div class="artRail" style="padding-inline:0"><div class="railHead"><h2>Fortsätt genom rummet</h2></div><div class="artGrid">${products.slice(1,6).map(tile).join('')}</div></div></main>`}
    function collections(){return `<main class="page"><span class="eyebrow">Kollektioner · sammanhang</span><h1 class="display">Verk som hör ihop.</h1><p class="lede">Tematiska serier där färg, form och känsla får skapa en större berättelse.</p><div class="collectionBands"><div class="collectionBand"><span class="collectionNo">01</span><div><h2>Mjuka början</h2><p>En stillsam serie där närvaro och färg får växa långsamt.</p></div><a class="button" href="#product-01" data-route="product-01">Utforska ↗</a></div><div class="collectionBand"><span class="collectionNo">02</span><div><h2>Rörelse i rummet</h2><p>Kontraster, rytm och grafiska möten för en tydligare energi.</p></div><a class="button" href="#works" data-route="works">Se verk ↗</a></div><div class="collectionBand"><span class="collectionNo">03</span><div><h2>Stillhet och yta</h2><p>Taktila uttryck och mjukare paletter med plats för betraktaren.</p></div><a class="button" href="#works" data-route="works">Se verk ↗</a></div></div></main>`}
    function prints(){return `<main class="page"><span class="eyebrow">Prints · material</span><h1 class="display">Konst att leva med.</h1><p class="lede">Här samlar vi information om Fine Art Prints och Limited Editions när produktstandarden är beslutad.</p><div class="printGrid"><article class="printCard"><span class="eyebrow">01</span><h2>Fine Art Print</h2><p>Exempeltext om papper, färgåtergivning och hur verket produceras.</p></article><article class="printCard"><span class="eyebrow">02</span><h2>Limited Edition</h2><p>Exempeltext om numrerade upplagor och framtida tillgänglighet.</p></article><article class="printCard"><span class="eyebrow">03</span><h2>Format och mått</h2><p>Exakta storlekar och priser presenteras när sortimentet är fastställt.</p></article></div></main>`}
    function works(){return `<main class="page"><span class="eyebrow">Konstverk · katalog</span><h1 class="display">Välj ett verk.</h1><p class="lede">Bläddra bland placeholder-verken och öppna ett verk för att se mått, format och presentation.</p><div class="artGrid" style="margin-top:60px">${products.map(tile).join('')}</div></main>`}
    function productPage(p){return `<main class="page"><div class="productLayout"><div><span class="eyebrow">Angie's Art · ${p.title}</span><div class="productCanvas" style="background:${p.color};margin-top:22px">${String(p.id).padStart(2,'0')}</div></div><section class="productPanel"><span class="eyebrow">Produkt</span><h1>${p.title}</h1><p>Ett uttrycksfullt placeholder-verk. Här kommer den slutliga berättelsen, materialinformationen och priset när produktunderlaget är fastställt.</p><div class="field"><label for="size-${p.id}">Mått</label><select id="size-${p.id}"><option value="">Välj mått</option>${sizes.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label for="format-${p.id}">Format</label><select id="format-${p.id}"><option value="">Välj format</option><option>Fine Art Print</option><option>Limited Edition</option><option>Originalverk</option></select></div><button class="button buyButton" data-add="${p.id}" disabled>Välj mått och format</button><p class="choiceHint" id="hint-${p.id}">Välj både mått och format för att fortsätta.</p><div class="details"><details open><summary>Produktinformation</summary><p>Material, framställning och upplaga kompletteras före lansering.</p></details><details><summary>Frakt och retur</summary><p>Leveranssätt och returvillkor visas här när de är beslutade.</p></details><details><summary>Kundsupport</summary><p>Här kommer kontaktvägen för frågor om verk, format och beställning.</p></details></div></section></div></main>`}
    function cartPage(){if(!cart.length)return `<main class="page cartLayout"><div class="cartHeader"><div><span class="eyebrow">Angie's Art · beställning</span><h1>Din varukorg.</h1></div><p>Här samlas dina valda verk innan nästa steg.</p></div><div class="empty"><p>Varukorgen är tom just nu.</p><a class="button" href="#works" data-route="works">Utforska verken ↗</a></div></main>`;return `<main class="page cartLayout"><div class="cartHeader"><div><span class="eyebrow">Angie's Art · beställning</span><h1>Din varukorg.</h1></div><p>Granska dina val och fortsätt när du är redo.</p></div><div class="cartGrid"><div>${cart.map((item,i)=>`<div class="cartRow"><div class="cartThumb" style="background:${item.color}">${String(item.id).padStart(2,'0')}</div><div><h2>${item.title}</h2><div class="cartMeta">${item.format} · ${item.size}</div><div class="cartMeta">Pris fastställs före lansering</div></div><button class="remove" data-remove="${i}">Ta bort</button></div>`).join('')}</div><aside class="summary"><h2>Sammanfattning</h2><div class="summaryLine"><span>Antal verk</span><strong>${cart.length}</strong></div><div class="summaryLine"><span>Summa</span><strong>Pris senare</strong></div><div class="summaryLine"><span>Frakt</span><strong>Beräknas senare</strong></div><button class="button buyButton" disabled>Fortsätt till kassan</button><p class="choiceHint">Kassan öppnas när priser, frakt och betalningslösning är fastställda.</p></aside></div></main>`}
    function currentRoute(){return location.hash.slice(1)||'home'}
    function render(){let r=currentRoute();if(!routes.includes(r))r='home';if(r==='home')shell(home());else if(r==='gallery')shell(gallery());else if(r==='collections')shell(collections());else if(r==='prints')shell(prints());else if(r==='works')shell(works());else if(r==='studio')shell(simplePage('Ateljén · process','Bakom verken.','Här får processen, materialen och tankarna bakom konsten ta plats när berättelsen är redo att delas.','<a class="button" href="#works" data-route="works">Se verken ↗</a>'));else if(r==='about')shell(simplePage("Om Angie's Art",'En personlig värld.','Angie\'s Art Gallery är en plats för konst som får vara nära, taktil och långlivad. Mer om konstnären och visionen kommer här.'));else if(r==='information')shell(simplePage('Information · kundservice','Bra att veta.','Här samlar vi information om leverans, returer, kontakt och skötsel när villkoren är fastställda.','<div class="list"><div class="listRow"><span>Leverans</span><span>Kommer snart</span></div><div class="listRow"><span>Returer</span><span>Kommer snart</span></div><div class="listRow"><span>Kontakt</span><span>kontakt@angiesart.se</span></div></div>'));else if(r==='cart')shell(cartPage());else shell(productPage(products.find(p=>`product-${String(p.id).padStart(2,'0')}`===r)||products[0]));saveCart()}
    document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){e.preventDefault();location.hash=route.dataset.route;nav.classList.remove('open')}const remove=e.target.closest('[data-remove]');if(remove){cart.splice(Number(remove.dataset.remove),1);saveCart();render()}const add=e.target.closest('[data-add]');if(add&&!add.disabled){const info=add.closest('.productPanel'),id=Number(add.dataset.add),size=info.querySelector('select[id^="size-"]'),format=info.querySelector('select[id^="format-"]');cart.push({id,title:`Verk ${String(id).padStart(2,'0')}`,color:products[id-1].color,size:size.value,format:format.value});saveCart();add.textContent='Tillagd i varukorg';add.disabled=true}});document.querySelector('#menuToggle').onclick=()=>nav.classList.toggle('open');document.querySelector('#cartToggle').onclick=()=>location.hash='cart';document.querySelector('#searchToggle').onclick=()=>{const panel=document.querySelector('#searchPanel'),open=panel.classList.toggle('open');document.querySelector('#searchToggle').setAttribute('aria-expanded',open)};document.querySelector('#searchInput').oninput=e=>{const q=e.target.value.toLowerCase().trim();document.querySelector('#searchResults').innerHTML=q?products.filter(p=>p.title.toLowerCase().includes(q)||'konstverk'.includes(q)).slice(0,6).map(p=>`<a href="#product-${String(p.id).padStart(2,'0')}" data-route="product-${String(p.id).padStart(2,'0')}">${p.title} <span>↗</span></a>`).join(''):'<span class="choiceHint">Sök bland verk 01 till 10.</span>'};document.addEventListener('change',e=>{if(!e.target.matches('.productPanel select'))return;const panel=e.target.closest('.productPanel'),size=panel.querySelector('select[id^="size-"]'),format=panel.querySelector('select[id^="format-"]'),button=panel.querySelector('[data-add]'),hint=panel.querySelector('.choiceHint');if(format.value==='Originalverk'){size.innerHTML='<option value="Originalmått">Originalmått</option>';size.value='Originalmått';size.disabled=true}else if(size.disabled){size.innerHTML='<option value="">Välj mått</option>'+sizes.map(s=>`<option>${s}</option>`).join('');size.disabled=false;size.value=''}const ready=!!size.value&&!!format.value;button.disabled=!ready;button.textContent=ready?'Lägg i varukorg':(!size.value&&!format.value?'Välj mått och format':!format.value?'Välj format först':'Välj mått först');hint.textContent=ready?'Alla val är klara. Du kan lägga verket i varukorgen.':(!size.value&&!format.value?'Välj både mått och format för att fortsätta.':!format.value?'Måttet är valt — välj format för att fortsätta.':'Formatet är valt — välj mått för att fortsätta.')});window.addEventListener('hashchange',render);render();
  </script>
