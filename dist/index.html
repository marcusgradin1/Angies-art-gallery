<style>

isplay:grid;place-items:center;color:var(--fg);font:2rem var(--serif)}.cart-row h2{margin:0;font:400 1.4rem var(--serif)}.meta-text{font-size:.75rem;color:var(--muted)}.remove{background:none;border:0;text-decoration:underline;font-size:.68rem}footer{display:flex;justify-content:space-between;padding:2rem max(clamp(1.2rem,5vw,6rem),calc((100% - var(--max))/2));border-top:1px solid var(--line);color:var(--muted);font-size:.7rem}footer nav{display:flex;gap:1.5rem}footer a:hover{color:var(--accent)}

<body><a class="skip" href="#app">Hoppa till innehåll</a><header class="header"><a class="brand" href="#home" data-route="home"><span class="mark">AG</span><span>Angie's Art Gallery</span></a><nav class="nav" id="nav" aria-label="Huvudnavigation"><a href="#gallery" data-route="gallery">Galleri</a><a href="#collections" data-route="collections">Kollektioner</a><a href="#prints" data-route="prints">Prints</a><a href="#studio" data-route="studio">Ateljé</a><a href="#works" data-route="works">Konstverk</a><a href="#about" data-route="about">Om</a></nav><div class="actions"><button id="searchToggle" aria-expanded="false" aria-controls="search">Sök</button><button id="cartToggle">Varukorg <span class="count" id="count">0</span></button><button class="menu" id="menuToggle" aria-label="Öppna meny" aria-expanded="false" aria-controls="nav">Meny</button></div><div class="search" id="search" role="dialog" aria-label="Sök i galleriet"><label for="searchInput">Sök i galleriet</label><input id="searchInput" placeholder="Verk, format eller kollektion"><div class="results" id="results" aria-live="polite"></div></div></header><div id="app"></div><footer><span>Angie's Art Gallery</span><nav><a href="#information" data-route="information">Information</a><a href="#contact" data-route="contact">Kontakt</a><a href="#prints" data-route="prints">Prints</a><a href="#about" data-route="about">Om</a></nav></footer>
<script>
const products=Array.from({length:10},(_,i)=>({id:i+1,title:`Verk ${String(i+1).padStart(2,'0')}`})),routes=['home','gallery','collections','prints','studio','works','about','information','contact','cart',...products.map(p=>`product-${String(p.id).padStart(2,'0')}`)],sizes=['30 x 30 cm','50 x 50 cm','70 x 70 cm','100 x 100 cm'];let cart=JSON.parse(localStorage.getItem('angies-art-cart')||'[]'),app=document.querySelector('#app'),nav=document.querySelector('#nav'),count=document.querySelector('#count');
const link=(r,t)=>`<a class="button" href="#${r}" data-route="${r}">${t} <span aria-hidden="true">↗</span></a>`;function save(){localStorage.setItem('angies-art-cart',JSON.stringify(cart));count.textContent=cart.length}function current(){return location.hash.slice(1)||'home'}function mount(h){app.innerHTML=h;document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===current()));window.scrollTo({top:0,behavior:'smooth'});save()}function imageFor(p){return p.id%2?"assets/tiktok/angie-studio-sketch.jpg":"assets/tiktok/angie-blackboard-study.jpg"}function cards(ps=products.slice(0,3)){return`<div class="work-grid">${ps.map(p=>`<a class="work" href="#product-${String(p.id).padStart(2,'0')}" data-route="product-${String(p.id).padStart(2,'0')}" aria-label="Visa ${p.title}"><img class="work-image" src="${imageFor(p)}" alt="Tillfällig bild från Angies konstprocess"><div class="meta"><span>${p.title}</span><span>Öppna ↗</span></div></a>`).join('')}</div>`}
function home(){return`<main><section class="hero"><div><span class="eyebrow">Samtida konst / digital utställning</span><h1>Se <em>det</em> som känns.</h1><p>Angie's Art Gallery samlar verk med egen rytm, yta och närvaro.</p>${link('gallery','Gå in i galleriet')}</div><div class="visual"><a class="art" href="#product-01" data-route="product-01" aria-label="Öppna Verk 01"><img class="art-image" src="assets/tiktok/angie-studio-sketch.jpg" alt="Tillfällig bild från Angies ateljé"><span class="art-label">Verk 01 / ateljéstudie</span></a></div><aside class="note"><span class="eyebrow">Just nu</span><strong>Rörelse i vila.</strong><p>En första blick på ett nytt visuellt landskap.</p><div class="signal"><span>01 / Utvalt</span><span>↗</span></div><div class="signal"><span>02 / Prints</span><span>↗</span></div></aside></section><section class="statement"><span class="eyebrow">Om platsen</span><div><h2>Konst utan brådska.</h2><p>En gallerikänsla för skärmen. Kompositioner, kollektioner och prints får ta plats på sina egna villkor.</p>${link('about','Läs om Angie')}</div></section><div class="strip"><span>Utvalda verk</span><span>Bläddra vidare</span></div><section class="page"><div class="head"><h2>Tre sätt att börja.</h2><p>Välj en ingång och låt nästa bild leda vägen.</p></div>${cards()}</section></main>`}
function gallery(){return`<main class="page"><div class="intro"><div><span class="eyebrow">Galleri / utställningsvy</span><h1 class="display">En bild i taget.</h1></div><p class="lede">En kuraterad sal där serier och enskilda verk får mötas i ett långsammare tempo.</p></div><div class="gallery"><div class="large" aria-label="Tillfällig bild från Angies konstprocess"><img class="large-image" src="assets/tiktok/angie-studio-sketch.jpg" alt="Tillfällig bild av en skiss på staffli"><span class="art-label">Process / studie</span></div><div><span class="eyebrow">På väggen nu</span><h2>Färg som stannar kvar.</h2><p class="lede">Det här utrymmet blir den visuella berättelsen när de riktiga verken är redo.</p>${link('works','Se alla verk')}</div></div><section style="margin-top:8rem"><div class="head"><h2>Fortsätt genom rummet.</h2></div>${cards(products.slice(3,6))}</section></main>`}function collections(){return`<main class="page"><div class="intro"><div><span class="eyebrow">Kollektioner / sammanhang</span><h1 class="display">Flera världar, ett språk.</h1></div><p class="lede">Kollektionerna samlar verken efter känsla, material och rörelse.</p></div><div class="rows">${[['Mjuk geometri','Organiska former och färger som möts med luft mellan sig.','product-01'],['Efterklang','En serie om det som finns kvar efter den första blicken.','product-02'],['Röda trådar','Grafiska spår, kontraster och en tydligare energi.','works']].map((x,i)=>`<article class="row"><span class="no">0${i+1}</span><div><h3>${x[0]}</h3><p>${x[1]}</p></div>${link(x[2],'Utforska')}</article>`).join('')}</div></main>`}function prints(){return`<main class="page"><div class="intro"><div><span class="eyebrow">Prints / material och format</span><h1 class="display">Konst att ta med hem.</h1></div><p class="lede">Här samlas den praktiska kunskapen om Fine Art Prints och Limited Editions.</p></div><div class="print-grid">${[['Fine Art Print','Exempeltext om papper, färgåtergivning och noggrann produktion.'],['Limited Edition','Exempeltext om numrerade upplagor och verkets livslängd.'],['Format','Storlekar, inramning, leverans och skötsel fylls i här senare.']].map((x,i)=>`<article class="print"><span class="eyebrow">0${i+1}</span><h2>${x[0]}</h2><p>${x[1]}</p></article>`).join('')}</div></main>`}function works(){return`<main class="page"><div class="intro"><div><span class="eyebrow">Konstverk / katalog</span><h1 class="display">Hitta din bild.</h1></div><p class="lede">En samling tillfälliga placeholder-verk tills det riktiga sortimentet tar plats.</p></div><div style="margin-top:5rem">${cards(products)}</div></main>`}function simple(e,t,c,r='works',l='Se verken'){return`<main class="page"><div class="intro"><div><span class="eyebrow">${e}</span><h1 class="display">${t}</h1></div><div><p class="lede">${c}</p>${link(r,l)}</div></div></main>`}function product(p){const views=[['front','Framsida','assets/tiktok/angie-studio-sketch.jpg','Skiss på staffli från Angies ateljé'],['close','Närbild','assets/tiktok/angie-blackboard-study.jpg','Närbild av ett pågående konstverk'],['detail','Detalj','assets/tiktok/angie-studio-sketch.jpg','Detaljstudie av staffli och skiss']];return`<main class="page"><div class="product"><div class="product-gallery"><span class="eyebrow">Bildvisning / tre vyer</span><div class="product-stage" data-product-stage data-view="front"><img src="${views[0][2]}" alt="${views[0][3]}" data-product-image><span class="product-stage-label">01 / Framsida</span></div><div class="product-view-grid" aria-label="Välj bildvy">${views.map((v,i)=>`<button type="button" class="product-view${i===0?' active':''}" data-view="${v[0]}" data-image="${v[2]}" data-alt="${v[3]}" aria-pressed="${i===0?'true':'false'}"><img src="${v[2]}" alt=""><span>0${i+1} / ${v[1]}</span></button>`).join('')}</div></div><section class="panel"><span class="eyebrow">Angie's Art / ${p.title}</span><h1>${p.title}</h1><p>Ett uttrycksfullt verk presenterat i flera vyer. Välj storlek och format för att förbereda din beställning.</p><div class="signal"><span>Status</span><span>Pris fastställs senare</span></div><div class="field"><label for="size-${p.id}">Mått</label><select id="size-${p.id}"><option value="">Välj mått</option>${sizes.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label for="format-${p.id}">Format</label><select id="format-${p.id}"><option value="">Välj format</option><option>Fine Art Print</option><option>Limited Edition</option><option>Originalverk</option></select></div><button class="button buy" data-add="${p.id}" disabled>Välj mått och format</button><p class="hint">Välj båda alternativen för att fortsätta.</p><a class="button" href="#works" data-route="works">Tillbaka till konstverken</a><div class="details"><details open><summary>Produktinformation</summary><p>Material, framställning, mått och eventuell upplaga kompletteras när produktstandarden är fastställd.</p></details><details><summary>Frakt och retur</summary><p>Leverans, emballage och returvillkor läggs in här före lansering.</p></details><details><summary>Kundsupport</summary><p>Frågor om format, inramning eller beställning får en tydlig kontaktväg här.</p></details><details><summary>Fler verk att upptäcka</summary><p>Bläddra vidare bland andra verk när du vill jämföra uttryck och format.</p></details></div></section></div></main>`}function cartPage(){return`<main class="page"><span class="eyebrow">Varukorg / dina val</span><h1 class="display">${cart.length?'Din samling.':'Tomt, än så länge.'}</h1>${cart.length?`<div class="cart-items">${cart.map((x,i)=>`<div class="cart-row"><div class="thumb">${String(x.id).padStart(2,'0')}</div><div><h2>${x.title}</h2><div class="meta-text">${x.format} / ${x.size}</div><div class="meta-text">Pris fastställs före lansering</div></div><button class="remove" data-remove="${i}">Ta bort</button></div>`).join('')}</div><aside class="summary"><div class="signal"><span>Antal verk</span><span>${cart.length}</span></div><div class="signal"><span>Summa</span><span>Pris senare</span></div><button class="button buy" disabled>Fortsätt till kassan</button></aside>`:`<p class="lede">När du hittar ett verk du vill spara, lägger du det här.</p>${link('works','Utforska verk')}</main>`}`}
function render(){let r=current();if(!routes.includes(r))r='home';if(r==='home')mount(home());else if(r==='gallery')mount(gallery());else if(r==='collections')mount(collections());else if(r==='prints')mount(prints());else if(r==='works')mount(works());else if(r==='studio')mount(simple('Ateljé / process','Där idéer blir yta.','Ateljén blir platsen för material, skisser, misstag och det långsamma arbetet bakom verken.'));else if(r==='about')mount(simple('Om Angie / berättelsen','En personlig blick.','Angie’s Art Gallery är ett rum för verk som får vara nära, taktila och långlivade.'));else if(r==='information')mount(simple('Information / kundservice','Bra att veta.','Här samlas information om leverans, returer, kontakt och skötsel när villkoren är fastställda.','prints','Läs om prints'));else if(r==='contact')mount(simple('Kontakt / dialog','Hör av dig när du vill.','En tydlig kontaktväg läggs in här när rätt kontaktuppgifter och formulär är beslutade.','about','Om Angie'));else if(r==='cart')mount(cartPage());else mount(product(products.find(p=>`product-${String(p.id).padStart(2,'0')}`===r)||products[0]))}
document.addEventListener('click',e=>{const a=e.target.closest('[data-route]');if(a){e.preventDefault();location.hash=a.dataset.route;nav.classList.remove('open')}const view=e.target.closest('[data-view]');if(view){const stage=document.querySelector('[data-product-stage]');const image=document.querySelector('[data-product-image]');if(stage&&image){stage.dataset.view=view.dataset.view;image.src=view.dataset.image;image.alt=view.dataset.alt;stage.querySelector('.product-stage-label').textContent='View / '+view.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b===view);b.setAttribute('aria-pressed',b===view?'true':'false')})}}const rm=e.target.closest('[data-remove]');if(rm){cart.splice(Number(rm.dataset.remove),1);save();render()}const add=e.target.closest('[data-add]');if(add&&!add.disabled){const p=add.closest('.panel'),id=Number(add.dataset.add);cart.push({id,title:`Verk ${String(id).padStart(2,'0')}`,size:p.querySelector('select[id^="size-"]').value,format:p.querySelector('select[id^="format-"]').value});save();add.textContent='Tillagd i varukorg';add.disabled=true}});document.querySelector('#menuToggle').onclick=()=>nav.classList.toggle('open');document.querySelector('#cartToggle').onclick=()=>location.hash='cart';document.querySelector('#searchToggle').onclick=()=>{const s=document.querySelector('#search'),open=s.classList.toggle('open');document.querySelector('#searchToggle').setAttribute('aria-expanded',open)};document.querySelector('#searchInput').oninput=e=>{const q=e.target.value.toLowerCase().trim();document.querySelector('#results').innerHTML=q?products.filter(p=>p.title.toLowerCase().includes(q)||'konstverk'.includes(q)).slice(0,6).map(p=>`<a href="#product-${String(p.id).padStart(2,'0')}" data-route="product-${String(p.id).padStart(2,'0')}">${p.title} ↗</a>`).join(''):'<span class="hint">Skriv ett verk eller konstverk.</span>'};document.addEventListener('change',e=>{if(!e.target.matches('.panel select'))return;const p=e.target.closest('.panel'),size=p.querySelector('select[id^="size-"]'),format=p.querySelector('select[id^="format-"]'),b=p.querySelector('[data-add]');if(format.value==='Originalverk'){size.innerHTML='<option value="Originalmått">Originalmått</option>';size.value='Originalmått';size.disabled=true}const ready=!!size.value&&!!format.value;b.disabled=!ready;b.textContent=ready?'Lägg i varukorg':(!size.value&&!format.value?'Välj mått och format':!format.value?'Välj format först':'Välj mått först')});window.addEventListener('hashchange',render);render();
</script></body></html>
